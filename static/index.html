<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PicTrip</title>
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js" defer></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ─── Écran de login ─── -->
  <div id="auth-screen">
    <div class="auth-card">
      <h1 class="auth-logo">PicTrip</h1>
      <p class="auth-tagline">Retrace tes voyages sur le globe</p>

      <!-- Formulaire Login -->
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email" required autocomplete="email" />
        <input type="password" id="login-password" placeholder="Mot de passe" required autocomplete="current-password" />
        <button type="submit" class="glass-btn">Se connecter</button>
      </form>

      <!-- Formulaire Inscription -->
      <form id="signup-form" class="hidden">
        <input type="text" id="signup-username" placeholder="Nom d'utilisateur" required autocomplete="username" />
        <input type="email" id="signup-email" placeholder="Email" required autocomplete="email" />
        <input type="password" id="signup-password" placeholder="Mot de passe (6 car. min)" required autocomplete="new-password" minlength="6" />
        <button type="submit" class="glass-btn">Créer un compte</button>
      </form>

      <div id="auth-error" class="hidden"></div>

      <p class="auth-switch">
        <span id="switch-to-signup">Pas encore de compte ? <strong>S'inscrire</strong></span>
        <span id="switch-to-login" class="hidden">Déjà un compte ? <strong>Se connecter</strong></span>
      </p>
    </div>
  </div>

  <!-- ─── App (masquée tant que pas connecté) ─── -->
  <div id="app" class="hidden">
    <div id="map"></div>

    <div id="overlay">
      <h1>PicTrip</h1>
    </div>

    <!-- Bouton retour (mode voyage) -->
    <button id="back-btn" class="fab fab-small hidden" aria-label="Retour à l'accueil">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>

    <!-- Titre du voyage affiché en mode voyage -->
    <div id="trip-view-overlay" class="hidden">
      <h1 id="trip-view-name"></h1>
    </div>

    <!-- Bouton utilisateur en haut à droite -->
    <button id="user-btn" class="fab fab-small" aria-label="Mon compte">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
    </button>

    <!-- Menu utilisateur -->
    <div id="user-menu" class="hidden">
      <div id="user-menu-name"></div>
      <div id="user-menu-email"></div>
      <button id="logout-btn">Se déconnecter</button>
    </div>

    <!-- Boutons flottants bas-droite -->
    <div id="fab-stack">
      <button id="trips-btn" class="fab" aria-label="Mes voyages">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2 1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
        </svg>
      </button>
      <button id="add-btn" class="fab" aria-label="Ajouter des photos">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>

    <!-- Panneau : liste des voyages -->
    <div id="trips-panel" class="panel hidden">
      <div class="panel-backdrop"></div>
      <div class="panel-card panel-card--wide">
        <button class="panel-close" aria-label="Fermer">&times;</button>
        <h2>Mes voyages</h2>
        <div id="trips-list"></div>
        <p id="trips-empty" class="empty-msg">Aucun voyage pour le moment.</p>
      </div>
    </div>

    <!-- Panneau : galerie photo d'un voyage -->
    <div id="gallery-panel" class="panel hidden">
      <div class="panel-backdrop"></div>
      <div class="panel-card panel-card--gallery">
        <button class="panel-close" aria-label="Fermer">&times;</button>
        <div id="gallery-header">
          <h2 id="gallery-title"></h2>
          <span id="gallery-count"></span>
        </div>
        <div id="gallery-grid"></div>
        <p id="gallery-empty" class="empty-msg">Aucune photo dans ce voyage.</p>
      </div>
    </div>

    <!-- Lightbox plein écran -->
    <div id="lightbox" class="hidden">
      <button id="lightbox-close" aria-label="Fermer">&times;</button>
      <button id="lightbox-prev" aria-label="Précédent">&#8249;</button>
      <button id="lightbox-next" aria-label="Suivant">&#8250;</button>
      <div id="lightbox-content">
        <img id="lightbox-img" src="" alt="" />
        <div id="lightbox-map-container" class="hidden">
          <div id="lightbox-map"></div>
        </div>
      </div>
      <div id="lightbox-caption"></div>
    </div>

    <!-- Panneau : ajouter des photos -->
    <div id="upload-panel" class="panel hidden">
      <div class="panel-backdrop"></div>
      <div class="panel-card">
        <button class="panel-close" aria-label="Fermer">&times;</button>
        <h2>Ajouter des photos</h2>

        <div id="trip-name-bubble">
          <label for="trip-name-input">Nom du voyage</label>
          <input type="text" id="trip-name-input" placeholder="Ex : Italie 2024" autocomplete="off" />
        </div>

        <div id="trip-select-row" class="hidden">
          <span class="trip-select-label">ou ajouter à :</span>
          <select id="trip-select"></select>
        </div>

        <div id="drop-zone">
          <div class="drop-icon">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <p class="drop-text">Glisse tes photos ici</p>
          <p class="drop-or">ou</p>
          <label class="browse-btn">
            Parcourir
            <input type="file" id="file-input" multiple accept="image/*" hidden />
          </label>
        </div>

        <div id="file-list" class="hidden"></div>
        <button id="place-btn" class="glass-btn hidden">Placer</button>
        <div id="upload-status" class="hidden"></div>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
